<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caro</title><link rel="stylesheet" href="_base.css"><style>.caro{grid-template-columns:repeat(15,1fr);max-width:620px;margin:auto;background:#996b37;padding:5px}.caro button{aspect-ratio:1;border:0;border-radius:50%;background:#e7bd70;font-size:clamp(9px,2.5vw,17px);font-weight:900;color:#17111c}</style></head><body><main class="wrap"><div class="top"><a href="../">← Hub</a><h2>⚫ Caro</h2><span class="score" id="turn">X</span></div><div class="card"><div id="board" class="grid caro"></div><p class="msg">5 quân liên tiếp là thắng.</p><button class="action" onclick="reset()">Chơi lại</button></div></main><script>const N=15;let a=Array(N*N).fill(''),t='X',over=false;function draw(){board.innerHTML=a.map((v,i)=>`<button onclick="move(${i})">${v}</button>`).join('');turn.textContent=over?`Kết thúc: ${t}`:t}function win(i){let r=Math.floor(i/N),c=i%N;for(const[dR,dC]of[[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(let k=1;k<5;k++){let rr=r+dR*k,cc=c+dC*k;if(rr<0||rr>=N||cc<0||cc>=N||a[rr*N+cc]!==t)break;n++}for(let k=1;k<5;k++){let rr=r-dR*k,cc=c-dC*k;if(rr<0||rr>=N||cc<0||cc>=N||a[rr*N+cc]!==t)break;n++}if(n>=5)return true}return false}function move(i){if(over||a[i])return;a[i]=t;if(win(i)){over=true;draw();alert(t+' thắng!');return}if(a.every(Boolean)){over=true;draw();alert('Hòa!');return}t=t==='X'?'O':'X';draw()}function reset(){a.fill('');t='X';over=false;draw()}draw()</script></body></html>
